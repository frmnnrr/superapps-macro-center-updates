name: Build Draft Release Installer

# Workflow ini hanya dijalankan manual.
# Release/tag publik sudah berisi installer final, sehingga push tag tidak perlu
# mencoba membangun ulang aplikasi dari source ZIP versi lama.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag (contoh v1.18.31)
        required: true
      source_asset:
        description: Nama source ZIP yang sudah di-upload ke draft release
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download and extract source from draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_ASSET: ${{ inputs.source_asset }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw 'RELEASE_TAG wajib diisi.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SOURCE_ASSET)) {
            throw 'SOURCE_ASSET wajib diisi.'
          }

          New-Item -ItemType Directory -Force staging, source | Out-Null

          Write-Host "Release tag : $env:RELEASE_TAG"
          Write-Host "Source asset: $env:SOURCE_ASSET"

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Release/tag '$env:RELEASE_TAG' tidak ditemukan."
          }

          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern $env:SOURCE_ASSET `
            --dir staging

          if ($LASTEXITCODE -ne 0) {
            throw "Gagal mengunduh source asset '$env:SOURCE_ASSET' dari '$env:RELEASE_TAG'."
          }

          $archive = Join-Path $PWD "staging\$env:SOURCE_ASSET"
          if (-not (Test-Path $archive)) {
            $available = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
            throw "Source asset tidak ditemukan: $env:SOURCE_ASSET. Asset tersedia: $($available -join ', ')"
          }

          Expand-Archive -Path $archive -DestinationPath source -Force
          $roots = @(Get-ChildItem source -Directory)
          if ($roots.Count -eq 1) {
            $sourceRoot = $roots[0].FullName
          } else {
            $sourceRoot = (Resolve-Path source).Path
          }

          if (-not (Test-Path (Join-Path $sourceRoot 'runtime_support.py'))) {
            throw "Root source tidak valid: $sourceRoot (runtime_support.py tidak ditemukan)"
          }

          "SOURCE_ROOT=$sourceRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:SOURCE_ROOT
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-build.txt

      - name: Build application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:SOURCE_ROOT
          python -m compileall -q launcher.py app_center.py runtime_support.py update_manager.py modules
          python -m PyInstaller --noconfirm SuperappsMacroCenter.spec

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build and verify installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location $env:SOURCE_ROOT

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\SuperappsMacroCenter.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Kompilasi Inno Setup gagal: $LASTEXITCODE"
          }

          $version = $env:RELEASE_TAG.TrimStart('v')
          $installer = Join-Path $env:SOURCE_ROOT "release\Superapps_Macro_Center_Setup_v$version.exe"
          if (-not (Test-Path $installer)) {
            throw "Installer tidak terbentuk: $installer"
          }

          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $info = @(
            'Superapps Macro Center',
            "Version=$version",
            "Installer=$([IO.Path]::GetFileName($installer))",
            "SHA256=$hash",
            "BuiltAt=$([DateTime]::UtcNow.ToString('o'))"
          ) -join [Environment]::NewLine

          $info | Out-File (Join-Path $env:SOURCE_ROOT 'release\BUILD_INFO.txt') -Encoding utf8
          "INSTALLER_PATH=$installer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_NAME=$([IO.Path]::GetFileName($installer))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          "### Installer siap`n- File: ``$([IO.Path]::GetFileName($installer))```n- SHA-256: ``$hash``" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload build verification artifact
        uses: actions/upload-artifact@v4
        with:
          name: Superapps-Macro-Center-v${{ env.BUILD_VERSION }}-build-info
          path: |
            ${{ env.INSTALLER_PATH }}
            ${{ env.SOURCE_ROOT }}\release\BUILD_INFO.txt
          if-no-files-found: error
